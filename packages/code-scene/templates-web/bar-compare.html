<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>bar-compare · 柱状对比</title>
<!-- 渲染器经 addInitScript 注入 window.__THEME_CSS__,先挂到页首 -->
<style id="theme-vars"></style>
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: var(--bg, #0f1b2d);
    font-family: var(--font-display, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif);
    position: relative;
  }
  /* 网格底(纯 CSS 渐变网格) */
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--bg-grid, rgba(148,163,184,.05)) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid, rgba(148,163,184,.05)) 1px, transparent 1px);
    background-size: 108px 108px;
  }
  /* 中心辉光(呼吸) */
  .glow {
    position: absolute; left: 50%; top: 880px; width: 1000px; height: 1000px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--accent, #3b82f6) 0%, transparent 60%);
    opacity: .10; pointer-events: none;
  }
  /* 右上 L 形角标 */
  #corner {
    position: absolute; top: 100px; right: 100px; width: 130px; height: 130px;
    border-top: 8px solid color-mix(in srgb, var(--accent, #3b82f6) 50%, transparent);
    border-right: 8px solid color-mix(in srgb, var(--accent, #3b82f6) 50%, transparent);
    opacity: 0;
  }
  /* 左下小角标(取景框呼应) */
  #corner-bl {
    position: absolute; bottom: 56px; left: 56px; width: 80px; height: 80px;
    border-bottom: 5px solid color-mix(in srgb, var(--accent, #3b82f6) 35%, transparent);
    border-left: 5px solid color-mix(in srgb, var(--accent, #3b82f6) 35%, transparent);
    opacity: 0;
  }
  /* kicker 胶囊 */
  #kicker {
    position: absolute; top: 130px; left: 96px;
    font-size: 28px; letter-spacing: 6px; font-weight: 500;
    color: var(--accent, #3b82f6);
    border: 1px solid color-mix(in srgb, var(--accent, #3b82f6) 45%, transparent);
    padding: 10px 28px 10px 34px; border-radius: 999px;
    white-space: nowrap; opacity: 0;
  }
  /* 主标题 */
  #title {
    position: absolute; top: 210px; left: 96px; right: 96px;
    font-size: 64px; font-weight: 700; color: var(--text, #f1f5f9);
    line-height: 1.25; white-space: nowrap; opacity: 0;
  }
  /* 单位提示(右上,图表区上方) */
  #unit-hint {
    position: absolute; top: 340px; right: 96px;
    font-size: 24px; color: var(--text-sub, #94a3b8); opacity: 0;
  }
  /* 纵轴基准线 */
  #axis {
    position: absolute; width: 2px;
    background: color-mix(in srgb, var(--accent, #3b82f6) 30%, transparent);
    transform-origin: top center; opacity: 0;
  }
  /* 行 */
  .row { position: absolute; left: 0; right: 0; }
  .row .dot {
    position: absolute; left: 96px; width: 16px; height: 16px; border-radius: 50%;
    background: color-mix(in srgb, var(--text-sub, #94a3b8) 60%, transparent);
  }
  .row.hi .dot {
    background: var(--accent, #3b82f6);
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent, #3b82f6) 80%, transparent);
  }
  .row .label {
    position: absolute; left: 128px; width: 244px;
    font-size: 28px; font-weight: 500; color: var(--text, #f1f5f9);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .track {
    position: absolute; border-radius: 10px;
    background: color-mix(in srgb, var(--text, #f1f5f9) 5%, transparent);
    border: 1px solid color-mix(in srgb, var(--text, #f1f5f9) 7%, transparent);
  }
  .row .fill {
    position: absolute; border-radius: 10px;
    background: color-mix(in srgb, var(--accent-2, #60a5fa) 38%, transparent);
    transform-origin: left center;
  }
  .row.hi .fill {
    background: linear-gradient(90deg, var(--accent, #3b82f6), var(--accent-2, #60a5fa));
    box-shadow: 0 6px 28px color-mix(in srgb, var(--accent, #3b82f6) 45%, transparent),
                inset 0 2px 6px rgba(255,255,255,.25);
  }
  .row .val {
    position: absolute; left: 0;
    font-size: 36px; font-weight: 700; color: var(--text-sub, #94a3b8);
    white-space: nowrap; opacity: 0;
  }
  .row.hi .val { color: var(--accent-2, #60a5fa); }
  /* 数值文本内层 span:高亮脉冲的 scale 打在它上面,避免覆盖外层 translateX 动画 */
  .row .val .val-num { display: inline-block; transform-origin: left center; }
  /* 底部来源标注:bottom:170,避让字幕带 y∈[1418,1562] */
  #source {
    position: absolute; bottom: 170px; left: 96px;
    font-size: 24px; color: var(--text-sub, #94a3b8); opacity: 0;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow" id="glow"></div>
<div id="corner"></div>
<div id="corner-bl"></div>
<div id="kicker"></div>
<div id="title"></div>
<div id="unit-hint"></div>
<div id="axis"></div>
<div id="rows"></div>
<div id="source"></div>

<script>
(function () {
  // 主题令牌注入(web-worker 契约)
  document.getElementById("theme-vars").textContent = window.__THEME_CSS__ || "";

  var P = window.__PARAMS__ || {};
  var D = typeof P.duration === "number" && isFinite(P.duration) ? P.duration : 8;
  // 时间轴压缩:短镜头整体按比例收紧,保证尾帧完整信息态
  var TS = D >= 6 ? 1 : Math.max(0.55, (D - 1.2) / 4.6);

  // ── 数据 ──
  var bars = (P.bars || []).slice(0, 5);
  var n = bars.length;
  var unit = P.unit || "";
  var maxV = Math.max.apply(null, bars.map(function (b) { return b.value; }).concat([1]));
  var hi = typeof P.highlightIndex === "number"
    ? P.highlightIndex
    : bars.findIndex(function (b) { return b.value === maxV; });

  document.getElementById("kicker").textContent = P.kicker || "数据对比";
  document.getElementById("title").textContent = P.title || "";
  var unitHint = document.getElementById("unit-hint");
  if (unit) unitHint.textContent = "单位:" + unit; else unitHint.style.display = "none";
  var srcEl = document.getElementById("source");
  if (P.source) srcEl.textContent = "来源:" + P.source; else srcEl.style.display = "none";

  // ── 数字格式化(与 big-number 同规则:≥10000 千分位空格,小值保留小数) ──
  function decOf(v) {
    var s = String(v);
    var i = s.indexOf(".");
    return i < 0 ? 0 : Math.min(2, s.length - i - 1);
  }
  function fmt(v, dec) {
    var neg = v < 0 ? "-" : "";
    var abs = Math.abs(v);
    var s = dec > 0 ? abs.toFixed(dec) : String(Math.round(abs));
    if (abs >= 10000) {
      var parts = s.split(".");
      parts[0] = Number(parts[0]).toLocaleString("en-US").replace(/,/g, " ");
      s = parts.join(".");
    }
    return neg + s;
  }

  // ── 布局:图表区 y∈[470,1380],避让字幕带(1418-1562),左右边距 96 ──
  var CHART_TOP = 470, CHART_BOTTOM = 1380;
  var rowH = Math.min(172, (CHART_BOTTOM - CHART_TOP) / n);
  var BAR_X = 388;                 // 96 + 32(dot) + 244(label) + 16
  var VAL_RESERVE = 210;           // 数值标签预留
  var BAR_MAX_W = 1080 - 96 - BAR_X - 24 - VAL_RESERVE;
  var barH = Math.round(rowH * 0.44);

  var rowsEl = document.getElementById("rows");
  var metas = [];
  for (var i = 0; i < n; i++) {
    (function (i) {
      var b = bars[i];
      var isHi = i === hi;
      var rowTop = CHART_TOP + i * rowH;
      var cy = rowTop + rowH / 2;
      var w = Math.max(28, Math.round((b.value / maxV) * BAR_MAX_W));

      var row = document.createElement("div");
      row.className = "row" + (isHi ? " hi" : "");
      row.style.top = rowTop + "px";
      row.style.height = rowH + "px";
      row.style.opacity = "0";

      var dot = document.createElement("div");
      dot.className = "dot";
      dot.style.top = (rowH / 2 - 8) + "px";
      row.appendChild(dot);

      var label = document.createElement("div");
      label.className = "label";
      label.style.top = (rowH / 2 - 24) + "px";
      label.style.height = "48px";
      label.style.lineHeight = "48px";
      label.textContent = b.label;
      row.appendChild(label);

      var track = document.createElement("div");
      track.className = "track";
      track.style.left = BAR_X + "px";
      track.style.top = (cy - rowTop - barH / 2) + "px";
      track.style.width = BAR_MAX_W + "px";
      track.style.height = barH + "px";
      row.appendChild(track);

      var fill = document.createElement("div");
      fill.className = "fill";
      fill.style.left = BAR_X + "px";
      fill.style.top = (cy - rowTop - barH / 2) + "px";
      fill.style.width = w + "px";
      fill.style.height = barH + "px";
      row.appendChild(fill);

      var val = document.createElement("div");
      val.className = "val";
      val.style.left = BAR_X + "px";
      val.style.top = (cy - rowTop - 27) + "px";
      val.style.height = "54px";
      val.style.lineHeight = "54px";
      var valNum = document.createElement("span");
      valNum.className = "val-num";
      val.appendChild(valNum);
      row.appendChild(val);

      rowsEl.appendChild(row);
      metas.push({ row: row, fill: fill, val: val, valNum: valNum, w: w, target: b.value, dec: decOf(b.value) });
    })(i);
  }

  // 纵轴基准线
  var axis = document.getElementById("axis");
  axis.style.left = (BAR_X - 14) + "px";
  axis.style.top = (CHART_TOP - 26) + "px";
  axis.style.height = (CHART_BOTTOM - CHART_TOP + 52) + "px";

  // ── 动画时间轴(全部 WAAPI,fill:both,确定性 seek) ──
  var EASE = (getComputedStyle(document.documentElement).getPropertyValue("--ease-out") || "").trim()
    || "cubic-bezier(0.16, 1, 0.3, 1)";
  var SPRING = "cubic-bezier(0.34, 1.56, 0.64, 1)";

  var corner = document.getElementById("corner");
  var cornerBl = document.getElementById("corner-bl");
  corner.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 800, fill: "both", easing: "ease-out" });
  cornerBl.animate([{ opacity: 0 }, { opacity: 1 }], { delay: 300, duration: 800, fill: "both", easing: "ease-out" });
  document.getElementById("kicker").animate(
    [{ opacity: 0, transform: "translateY(24px)" }, { opacity: 1, transform: "translateY(0)" }],
    { duration: 500 * TS, fill: "both", easing: EASE });
  document.getElementById("title").animate(
    [{ opacity: 0, transform: "translateY(32px)" }, { opacity: 1, transform: "translateY(0)" }],
    { delay: 150 * TS, duration: 600 * TS, fill: "both", easing: EASE });
  unitHint.animate([{ opacity: 0 }, { opacity: 0.85 }],
    { delay: 700 * TS, duration: 500 * TS, fill: "both", easing: "ease-out" });
  srcEl.animate([{ opacity: 0 }, { opacity: 0.75 }],
    { delay: 900 * TS, duration: 500 * TS, fill: "both", easing: "ease-out" });
  // 纵轴绘制
  axis.animate(
    [{ opacity: 0, transform: "scaleY(0)" }, { opacity: 1, transform: "scaleY(1)" }],
    { delay: 550 * TS, duration: 500 * TS, fill: "both", easing: EASE });

  // 柱条错峰生长:scaleX 0→1.04→1 弹簧,数值标签跟随条尾
  var BAR_START = 900 * TS, STAGGER = 340 * TS, GROW = 1100 * TS;
  metas.forEach(function (m, i) {
    var d = BAR_START + i * STAGGER;
    m.row.animate(
      [{ opacity: 0, transform: "translateX(-28px)" }, { opacity: 1, transform: "translateX(0)" }],
      { delay: d, duration: 420 * TS, fill: "both", easing: EASE });
    m.fill.animate(
      [{ transform: "scaleX(0)" },
       { transform: "scaleX(1.035)", offset: 0.72 },
       { transform: "scaleX(1)" }],
      { delay: d, duration: GROW, fill: "both", easing: SPRING });
    m.val.animate(
      [{ opacity: 0, transform: "translateX(0px)" },
       { opacity: 1, transform: "translateX(" + Math.round(m.w * 1.035 + 24) + "px)", offset: 0.72 },
       { opacity: 1, transform: "translateX(" + (m.w + 24) + "px)" }],
      { delay: d, duration: GROW, fill: "both", easing: SPRING });
  });

  // 全部落地后:最高柱辉光脉冲 + 数值缩放强调
  var landed = BAR_START + (n - 1) * STAGGER + GROW;
  if (hi >= 0 && metas[hi]) {
    metas[hi].fill.animate(
      [{ filter: "brightness(1)" }, { filter: "brightness(1.35)", offset: 0.4 }, { filter: "brightness(1)" }],
      { delay: landed + 350 * TS, duration: 650 * TS, fill: "both", easing: "ease-in-out" });
    metas[hi].valNum.animate(
      [{ transform: "scale(1)" },
       { transform: "scale(1.14)", offset: 0.45 },
       { transform: "scale(1)" }],
      { delay: landed + 350 * TS, duration: 650 * TS, fill: "both", easing: "ease-in-out" });
  }

  // 全程辉光呼吸
  document.getElementById("glow").animate(
    [{ opacity: 0.08 }, { opacity: 0.16 }, { opacity: 0.08 }],
    { duration: Math.round(D * 1000), fill: "both", easing: "ease-in-out" });

  // ── 数值计数(__seek 驱动,与柱条生长同窗,cubic-out 缓动,落地即精确终值) ──
  window.__seek = function (t) {
    metas.forEach(function (m, i) {
      var start = (BAR_START + i * STAGGER) / 1000;
      var dur = GROW / 1000;
      var x = Math.min(Math.max((t - start) / dur, 0), 1);
      var p = 1 - Math.pow(1 - x, 3);
      m.valNum.textContent = x >= 1 ? fmt(m.target, m.dec) + unit : fmt(m.target * p, m.dec) + unit;
    });
  };
  window.__seek(0);
})();
</script>
</body>
</html>
