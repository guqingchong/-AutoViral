<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--bg, #0f1b2d); font-family: var(--font-display, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif); position: relative; }
  .grid-bg { position: absolute; inset: 0;
    background-image: linear-gradient(var(--bg-grid, rgba(148,163,184,.05)) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid, rgba(148,163,184,.05)) 1px, transparent 1px);
    background-size: 96px 96px; }
  .glow { position: absolute; left: 50%; top: 540px; width: 1300px; height: 800px; transform: translate(-50%,-50%);
    background: radial-gradient(circle, var(--accent, #3b82f6) 0%, transparent 60%); opacity: .13; pointer-events: none; }
  .kicker { position: absolute; top: 72px; left: 96px; font-size: 26px; letter-spacing: 6px;
    color: var(--accent, #3b82f6); border: 1px solid color-mix(in srgb, var(--accent, #3b82f6) 45%, transparent);
    padding: 10px 22px 10px 28px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
  .title { position: absolute; top: 140px; left: 96px; font-size: 54px; font-weight: 700; color: var(--text, #f1f5f9); }
  .count { position: absolute; top: 240px; left: 96px; font-size: 28px; color: var(--text-sub, #94a3b8); font-weight: 500; }
  .count b { color: var(--accent, #3b82f6); font-size: 40px; font-weight: 900; }
  svg.flow { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  svg.flow path { stroke: var(--accent, #3b82f6); stroke-width: 3; fill: none; opacity: .55; }
  .step { position: absolute; top: 400px; width: 380px;
    background: color-mix(in srgb, var(--text, #f1f5f9) 6%, transparent);
    backdrop-filter: blur(12px);
    border: 1px solid color-mix(in srgb, var(--text, #f1f5f9) 12%, transparent);
    border-left: 4px solid var(--accent, #3b82f6);
    border-radius: var(--radius-card, 24px);
    box-shadow: var(--shadow-lg, 0 24px 64px rgba(2,8,23,.55));
    padding: 26px 28px; box-sizing: border-box; }
  .step .num { position: absolute; top: -34px; left: 24px; width: 68px; height: 68px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-2, #60a5fa), var(--accent, #3b82f6));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 30px; font-weight: 800;
    box-shadow: 0 8px 24px color-mix(in srgb, var(--accent, #3b82f6) 50%, transparent); }
  .step h3 { margin: 22px 0 8px; font-size: 34px; font-weight: 700; color: var(--text, #f1f5f9); }
  .step p { margin: 0; font-size: 25px; color: var(--text-sub, #94a3b8); line-height: 1.55; }
  .corner { position: absolute; width: 56px; height: 56px; opacity: .35;
    border-color: var(--accent, #3b82f6); border-style: solid; border-width: 0; }
  .corner.tl { top: 40px; left: 40px; border-top-width: 4px; border-left-width: 4px; }
  .corner.tr { top: 40px; right: 40px; border-top-width: 4px; border-right-width: 4px; }
  .corner.bl { bottom: 40px; left: 40px; border-bottom-width: 4px; border-left-width: 4px; }
  .corner.br { bottom: 40px; right: 40px; border-bottom-width: 4px; border-right-width: 4px; }
  .source { position: absolute; bottom: 28px; left: 96px; font-size: 22px; color: var(--text-sub, #94a3b8); opacity: .8; }
</style>
</head>
<body>
<div class="grid-bg"></div><div class="glow" id="glow"></div>
<div class="kicker" id="kicker"></div><div class="title" id="title"></div>
<div class="count" id="count"></div>
<svg class="flow" id="flow" viewBox="0 0 1920 1080"></svg>
<div id="steps"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="source" id="source"></div>
<script>
(function () {
  var style = document.createElement("style");
  style.textContent = window.__THEME_CSS__ || "";
  document.head.appendChild(style);
  var P = window.__PARAMS__ || {};
  var D = P.duration || 8;

  var steps = (P.steps || [
    { title: "项目储备", desc: "筛选入库,完成前期手续" },
    { title: "方案编制", desc: "一案两书,收益自求平衡" },
    { title: "评审发行", desc: "省厅评审,额度分配发行" },
    { title: "资金管理", desc: "拨付使用,绩效评价偿付" },
  ]).slice(0, 5);
  var n = steps.length;

  document.getElementById("kicker").textContent = P.kicker || "流程拆解";
  document.getElementById("title").textContent = P.title || "";
  document.getElementById("source").textContent = P.source ? "来源:" + P.source : "";

  // 横向步骤排布:可用宽 1728(96 边距),卡宽 380,居中分布;卡片底缘 ≤760(字幕带 900 起)
  var CARD_W = 380, AREA_L = 96, AREA_R = 1920 - 96;
  var totalW = n * CARD_W;
  var gap = n > 1 ? Math.min(64, (AREA_R - AREA_L - totalW) / (n - 1)) : 0;
  var startX = AREA_L + Math.max(0, (AREA_R - AREA_L - totalW - gap * (n - 1)) / 2);
  var CARD_TOP = 400;
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("flow");
  var stepsEl = document.getElementById("steps");

  var centers = [];
  steps.forEach(function (s, i) {
    var x = startX + i * (CARD_W + gap);
    centers.push(x + CARD_W / 2);
    var card = document.createElement("div");
    card.className = "step";
    card.style.left = x + "px";
    card.style.top = CARD_TOP + "px";
    card.innerHTML = '<div class="num">' + (i + 1) + "</div><h3>" + (s.title || "") + "</h3><p>" + (s.desc || "") + "</p>";
    stepsEl.appendChild(card);
  });
  // 连接线:卡间水平箭头(y=350,徽章高度)
  for (var i = 0; i < n - 1; i++) {
    var x1 = centers[i] + CARD_W / 2 - 14, x2 = centers[i + 1] - CARD_W / 2 + 14;
    var y = CARD_TOP + 110;
    var path = document.createElementNS(NS, "path");
    path.setAttribute("d", "M " + x1 + " " + y + " L " + x2 + " " + y);
    svg.appendChild(path);
    var arrow = document.createElementNS(NS, "polygon");
    arrow.setAttribute("points", x2 + "," + y + " " + (x2 - 14) + "," + (y - 8) + " " + (x2 - 14) + "," + (y + 8));
    arrow.setAttribute("fill", "var(--accent, #3b82f6)");
    arrow.setAttribute("class", "flow-arrow");
    svg.appendChild(arrow);
  }

  var EASE = "cubic-bezier(0.16, 1, 0.3, 1)";
  var SPRING = "cubic-bezier(0.34, 1.56, 0.64, 1)";
  function add(el, kf, o) { el.animate(kf, Object.assign({ fill: "both" }, o)); }

  add(document.getElementById("kicker"), [{ opacity: 0, transform: "translateY(24px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 450, easing: EASE });
  add(document.getElementById("title"), [{ opacity: 0, transform: "translateY(30px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 550, delay: 140, easing: EASE });

  var stagger = Math.min(0.9, Math.max(0.35, (D * 0.6 - 1) / Math.max(n - 1, 1)));
  document.querySelectorAll(".step").forEach(function (card, i) {
    var d0 = 700 + i * stagger * 1000;
    add(card, [{ opacity: 0, transform: "translateY(70px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 600, delay: d0, easing: SPRING });
    var num = card.querySelector(".num");
    add(num, [{ transform: "scale(0)" }, { transform: "scale(1.15)", offset: 0.7 }, { transform: "scale(1)" }], { duration: 500, delay: d0 + 250, easing: SPRING });
    add(card, [{ transform: "scale(1)" }, { transform: "scale(1.04)" }, { transform: "scale(1)" }], { duration: 400, delay: d0 + 650, easing: EASE });
  });
  svg.querySelectorAll("path").forEach(function (p, i) {
    var len = p.getTotalLength();
    p.style.strokeDasharray = String(len);
    p.style.strokeDashoffset = String(len);
    p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
      { duration: 350, delay: 700 + i * stagger * 1000 + stagger * 500, fill: "both", easing: EASE });
  });
  svg.querySelectorAll(".flow-arrow").forEach(function (a, i) {
    a.animate([{ opacity: 0 }, { opacity: 0.9 }], { duration: 300, delay: 950 + i * stagger * 1000 + stagger * 500, fill: "both" });
  });
  add(document.getElementById("count"), [{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: 600, easing: EASE });
  add(document.getElementById("glow"), [{ opacity: 0.09 }, { opacity: 0.16 }, { opacity: 0.09 }], { duration: Math.round(D * 1000), easing: "ease-in-out" });

  window.__seek = function (t) {
    var v = 0;
    for (var i = 0; i < n; i++) if (t >= 0.7 + i * stagger + 0.3) v = i + 1;
    document.getElementById("count").innerHTML = v === 0
      ? "共 <b>" + n + "</b> 步" : "共 <b>" + n + "</b> 步 · 当前第 <b>" + v + "</b> 步";
  };
  window.__seek(0);
})();
</script>
</body>
</html>
