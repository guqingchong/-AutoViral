<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--bg, #0f1b2d); font-family: var(--font-display, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif); position: relative; }
  .grid-bg { position: absolute; inset: 0;
    background-image: linear-gradient(var(--bg-grid, rgba(148,163,184,.05)) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid, rgba(148,163,184,.05)) 1px, transparent 1px);
    background-size: 96px 96px; }
  .kicker { position: absolute; top: 72px; left: 96px; font-size: 26px; letter-spacing: 6px;
    color: var(--accent, #3b82f6); border: 1px solid color-mix(in srgb, var(--accent, #3b82f6) 45%, transparent);
    padding: 10px 22px 10px 28px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
  .title { position: absolute; top: 140px; left: 0; right: 0; text-align: center;
    font-size: 54px; font-weight: 700; color: var(--text, #f1f5f9); }
  .panel { position: absolute; top: 280px; width: 780px; min-height: 540px;
    background: color-mix(in srgb, var(--text, #f1f5f9) 6%, transparent);
    backdrop-filter: blur(12px);
    border: 1px solid color-mix(in srgb, var(--text, #f1f5f9) 12%, transparent);
    border-radius: var(--radius-card, 24px);
    box-shadow: var(--shadow-lg, 0 24px 64px rgba(2,8,23,.55));
    padding: 36px 44px; box-sizing: border-box; }
  .panel.left { left: 110px; border-top: 5px solid var(--accent, #3b82f6); }
  .panel.right { right: 110px; opacity: .92; }
  .panel h3 { margin: 0 0 22px; font-size: 38px; font-weight: 800; color: var(--text, #f1f5f9);
    display: flex; align-items: center; gap: 14px; }
  .panel.left h3::before { content: ""; width: 16px; height: 16px; border-radius: 4px;
    background: var(--accent, #3b82f6); box-shadow: 0 0 14px var(--accent, #3b82f6); }
  .panel.right h3::before { content: ""; width: 16px; height: 16px; border-radius: 50%;
    background: var(--text-sub, #94a3b8); opacity: .6; }
  .panel ul { margin: 0; padding: 0; list-style: none; }
  .panel li { font-size: 29px; color: var(--text-sub, #94a3b8); line-height: 1.5; margin-bottom: 20px;
    padding-left: 34px; position: relative; }
  .panel.left li { color: var(--text, #f1f5f9); }
  .panel li::before { content: ""; position: absolute; left: 0; top: 19px; width: 14px; height: 3px;
    background: var(--accent, #3b82f6); opacity: .8; }
  .panel.right li::before { background: var(--text-sub, #94a3b8); opacity: .5; }
  .vs { position: absolute; left: 50%; top: 545px; transform: translate(-50%,-50%);
    width: 130px; height: 130px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-2, #60a5fa), var(--accent, #3b82f6));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 46px; font-weight: 900; font-style: italic;
    box-shadow: 0 12px 48px color-mix(in srgb, var(--accent, #3b82f6) 55%, transparent); }
  .divider { position: absolute; left: 50%; top: 260px; width: 2px; height: 620px;
    background: color-mix(in srgb, var(--text, #f1f5f9) 10%, transparent); transform: translateX(-1px) scaleY(0); transform-origin: top; }
  .verdict { position: absolute; left: 0; right: 0; top: 880px; text-align: center;
    font-size: 32px; font-weight: 600; color: var(--accent, #3b82f6); opacity: 0; }
  .corner { position: absolute; width: 56px; height: 56px; opacity: .35;
    border-color: var(--accent, #3b82f6); border-style: solid; border-width: 0; }
  .corner.tl { top: 40px; left: 40px; border-top-width: 4px; border-left-width: 4px; }
  .corner.tr { top: 40px; right: 40px; border-top-width: 4px; border-right-width: 4px; }
  .corner.bl { bottom: 40px; left: 40px; border-bottom-width: 4px; border-left-width: 4px; }
  .corner.br { bottom: 40px; right: 40px; border-bottom-width: 4px; border-right-width: 4px; }
  .source { position: absolute; bottom: 28px; left: 96px; font-size: 22px; color: var(--text-sub, #94a3b8); opacity: .8; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="kicker" id="kicker"></div><div class="title" id="title"></div>
<div class="divider" id="divider"></div>
<div class="panel left" id="panel-l"><h3 id="label-l"></h3><ul id="list-l"></ul></div>
<div class="panel right" id="panel-r"><h3 id="label-r"></h3><ul id="list-r"></ul></div>
<div class="vs" id="vs">VS</div>
<div class="verdict" id="verdict"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="source" id="source"></div>
<script>
(function () {
  var style = document.createElement("style");
  style.textContent = window.__THEME_CSS__ || "";
  document.head.appendChild(style);
  var P = window.__PARAMS__ || {};
  var D = P.duration || 8;

  var left = P.left || { label: "传统融资", points: ["抵押担保门槛高", "审批链条长", "额度受限"] };
  var right = P.right || { label: "专项债", points: ["政府信用背书", "一案两书标准化", "利率低期限长", "额度单列"] };
  left.points = (left.points || []).slice(0, 4);
  right.points = (right.points || []).slice(0, 4);

  document.getElementById("kicker").textContent = P.kicker || "对比透视";
  document.getElementById("title").textContent = P.title || "";
  document.getElementById("label-l").textContent = left.label;
  document.getElementById("label-r").textContent = right.label;
  document.getElementById("source").textContent = P.source ? "来源:" + P.source : "";
  if (P.verdict) document.getElementById("verdict").textContent = P.verdict;

  var listL = document.getElementById("list-l"), listR = document.getElementById("list-r");
  left.points.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; listL.appendChild(li); });
  right.points.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; listR.appendChild(li); });

  var EASE = "cubic-bezier(0.16, 1, 0.3, 1)";
  var SPRING = "cubic-bezier(0.34, 1.56, 0.64, 1)";
  function add(el, kf, o) { el.animate(kf, Object.assign({ fill: "both" }, o)); }

  add(document.getElementById("kicker"), [{ opacity: 0 }, { opacity: 1 }], { duration: 400, easing: EASE });
  add(document.getElementById("title"), [{ opacity: 0, transform: "translateY(26px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 550, delay: 130, easing: EASE });
  add(document.getElementById("divider"), [{ transform: "translateX(-1px) scaleY(0)" }, { transform: "translateX(-1px) scaleY(1)" }], { duration: 700, delay: 500, easing: EASE });
  add(document.getElementById("panel-l"), [{ opacity: 0, transform: "translateX(-90px)" }, { opacity: 1, transform: "translateX(0)" }], { duration: 650, delay: 600, easing: SPRING });
  add(document.getElementById("panel-r"), [{ opacity: 0, transform: "translateX(90px)" }, { opacity: 1, transform: "translateX(0)" }], { duration: 650, delay: 720, easing: SPRING });
  add(document.getElementById("vs"), [{ opacity: 0, transform: "translate(-50%,-50%) scale(0.3)" }, { opacity: 1, transform: "translate(-50%,-50%) scale(1.08)", offset: 0.72 }, { opacity: 1, transform: "translate(-50%,-50%) scale(1)" }], { duration: 600, delay: 1400, easing: SPRING });

  var rows = Math.max(left.points.length, right.points.length);
  var rowStagger = Math.min(420, Math.max(220, (D * 1000 * 0.45) / Math.max(rows, 1)));
  for (var i = 0; i < rows; i++) {
    var liL = listL.children[i], liR = listR.children[i];
    var d0 = 1800 + i * rowStagger;
    if (liL) add(liL, [{ opacity: 0, transform: "translateX(-24px)" }, { opacity: 1, transform: "translateX(0)" }], { duration: 380, delay: d0, easing: EASE });
    if (liR) add(liR, [{ opacity: 0, transform: "translateX(24px)" }, { opacity: 1, transform: "translateX(0)" }], { duration: 380, delay: d0 + 130, easing: EASE });
  }
  var endMs = 1800 + rows * rowStagger;
  add(document.getElementById("vs"), [{ transform: "translate(-50%,-50%) scale(1)" }, { transform: "translate(-50%,-50%) scale(1.12)" }, { transform: "translate(-50%,-50%) scale(1)" }], { duration: 450, delay: endMs, easing: EASE });
  if (P.verdict) add(document.getElementById("verdict"), [{ opacity: 0, transform: "translateY(20px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 500, delay: endMs + 350, easing: EASE });
})();
</script>
</body>
</html>
