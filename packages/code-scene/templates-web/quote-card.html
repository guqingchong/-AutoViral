<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>quote-card · 金句卡(方向A)</title>
<!-- 渲染器经 addInitScript 注入 window.__THEME_CSS__ / window.__PARAMS__ -->
<style id="theme-vars"></style>
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: var(--bg, #0f1b2d);
    font-family: var(--font-display, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif);
    position: relative;
  }
  /* 网格底(纯 CSS 渐变网格,token 驱动) */
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--bg-grid, rgba(148,163,184,.05)) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid, rgba(148,163,184,.05)) 1px, transparent 1px);
    background-size: 108px 108px;
  }
  /* 中央辉光(径向渐变 + 呼吸) */
  .glow {
    position: absolute; left: 50%; top: 900px; width: 1000px; height: 1000px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--accent, #3b82f6) 0%, transparent 60%);
    opacity: .12; pointer-events: none;
  }
  /* 角标(取景框语言) */
  .corner { position: absolute; width: 64px; height: 64px; opacity: .35;
    border-color: var(--accent, #3b82f6); border-style: solid; border-width: 0; }
  .corner.tl { top: 56px; left: 56px; border-top-width: 4px; border-left-width: 4px; }
  .corner.tr { top: 56px; right: 56px; border-top-width: 4px; border-right-width: 4px; }
  .corner.bl { bottom: 56px; left: 56px; border-bottom-width: 4px; border-left-width: 4px; }
  .corner.br { bottom: 56px; right: 56px; border-bottom-width: 4px; border-right-width: 4px; }

  .kicker {
    position: absolute; top: 120px; left: 96px;
    font-size: 28px; letter-spacing: 6px; color: var(--accent, #3b82f6);
    border: 1px solid color-mix(in srgb, var(--accent, #3b82f6) 45%, transparent);
    padding: 10px 28px 10px 34px; border-radius: 999px; font-weight: 500;
    white-space: nowrap;
  }
  .title {
    position: absolute; top: 196px; left: 96px; right: 96px;
    font-size: 64px; font-weight: 700; color: var(--text, #f1f5f9);
    line-height: 1.3;
  }

  /* 金句区:垂直居中弹性列,内容顶 520,底 1350,避开字幕带 y∈[1418,1562] */
  #quote-zone {
    position: absolute; top: 520px; left: 96px; right: 96px; height: 830px;
    display: flex; flex-direction: column; justify-content: center;
  }
  /* 巨型装饰引号「」(衬线,accent 低透明) */
  .mark {
    font-family: Georgia, "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
    font-size: 220px; font-weight: 900; line-height: .8;
    color: var(--accent, #3b82f6); opacity: 0;
    height: 120px; pointer-events: none; user-select: none;
  }
  .mark.open { align-self: flex-start; margin-left: -14px; }
  .mark.close { align-self: flex-end; margin-right: -14px; margin-top: 8px; }

  /* 金句正文:短语级 span 逐组揭示(clip-path 擦除 + 上浮) */
  #quote {
    font-size: 76px; font-weight: 700; color: var(--text, #f1f5f9);
    line-height: 1.62; letter-spacing: 1px;
    text-align: left;
  }
  #quote .ph {
    display: inline-block;
    will-change: transform, opacity, clip-path;
  }

  /*  accent 渐变下划线(width 扫入) */
  #underline {
    margin-top: 44px; height: 14px; width: 0; border-radius: 7px;
    background: linear-gradient(90deg, var(--accent, #3b82f6), var(--accent-2, #60a5fa));
    opacity: .95; align-self: flex-start;
  }

  /* 署名/出处:最后淡入,右对齐 */
  #attribution {
    margin-top: 52px; align-self: flex-end;
    font-size: 38px; font-weight: 500; color: var(--text-sub, #94a3b8);
    letter-spacing: 2px; opacity: 0; white-space: nowrap;
  }
  #attribution .dash { color: var(--accent, #3b82f6); margin-right: 14px; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow" id="glow"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div class="kicker" id="kicker"></div>
<div class="title" id="title"></div>

<div id="quote-zone">
  <div class="mark open" id="mark-open">「</div>
  <div id="quote"></div>
  <div id="underline"></div>
  <div id="attribution"><span class="dash">——</span><span id="attr-text"></span></div>
  <div class="mark close" id="mark-close">」</div>
</div>

<script>
(function () {
  // 主题令牌注入(web-worker 契约)
  document.getElementById("theme-vars").textContent = window.__THEME_CSS__ || "";

  var P = window.__PARAMS__ || {};
  var DURATION = typeof P.duration === "number" && isFinite(P.duration) ? P.duration : 8;

  // ── 文本填充(textContent,杜绝注入) ──
  var kickerEl = document.getElementById("kicker");
  var titleEl = document.getElementById("title");
  var quoteEl = document.getElementById("quote");
  var attrEl = document.getElementById("attribution");
  var attrText = document.getElementById("attr-text");
  if (P.kicker) kickerEl.textContent = P.kicker; else kickerEl.style.display = "none";
  if (P.title) titleEl.textContent = P.title; else titleEl.style.display = "none";
  if (P.source) attrText.textContent = P.source; else attrEl.style.display = "none";

  var quote = String(P.quote || "");
  // 自适应字号:≤18 字 88px / ≤36 字 76px / ≤60 字 62px
  quoteEl.style.fontSize = (quote.length <= 18 ? 88 : quote.length <= 36 ? 76 : 62) + "px";

  // 短语切分(与 Revideo 版语义一致:标点归属前组),全/半角标点均覆盖(　!?:;)
  var phrases = quote.split(/(?<=,|。|、|!|！|\?|？|,|，|;|；|:|：|…|\s)/).filter(function (s) { return s.length > 0; });
  if (phrases.length === 0) phrases = [""];
  phrases.forEach(function (ph) {
    var span = document.createElement("span");
    span.className = "ph";
    span.textContent = ph;
    quoteEl.appendChild(span);
  });

  // ── WAAPI 动画(全部 fill:"both",渲染器逐帧 seek) ──
  var EASE = (getComputedStyle(document.documentElement).getPropertyValue("--ease-out") || "").trim()
    || "cubic-bezier(0.16, 1, 0.3, 1)";
  var SPRING = "cubic-bezier(0.34, 1.56, 0.64, 1)";
  var add = function (el, kf, opts) { el.animate(kf, Object.assign({ fill: "both" }, opts)); };

  // 0.0-0.6s:角标 / kicker / 标题错峰淡入
  document.querySelectorAll(".corner").forEach(function (c, i) {
    add(c, [{ opacity: 0 }, { opacity: 0.35 }], { duration: 600, delay: i * 90, easing: "ease-out" });
  });
  if (P.kicker) add(kickerEl,
    [{ opacity: 0, transform: "translateY(24px)" }, { opacity: 1, transform: "translateY(0)" }],
    { duration: 500, delay: 100, easing: EASE });
  if (P.title) add(titleEl,
    [{ opacity: 0, transform: "translateY(32px)" }, { opacity: 1, transform: "translateY(0)" }],
    { duration: 600, delay: 250, easing: EASE });

  // 0.5s:「 弹簧入场(scale .4 → 1.08 → 1)
  var markOpen = document.getElementById("mark-open");
  add(markOpen,
    [{ opacity: 0, transform: "scale(.4)" },
     { opacity: 1, transform: "scale(1.08)", offset: 0.7 },
     { opacity: 1, transform: "scale(1)" }],
    { duration: 700, delay: 500, easing: SPRING });

  // 1.3s 起:短语逐组揭示 —— clip-path 左→右擦除 + 上浮 + 淡入(阅读节奏感)
  // 揭示窗口 ≈3.2s,随短语数自适应错峰;8 短语句最后一组 ~4.7s 显现完毕
  var spans = quoteEl.querySelectorAll(".ph");
  var n = spans.length;
  var REVEAL_START = 1300, PH_DUR = 500;
  var stagger = n > 1 ? Math.min(420, 3200 / (n - 1)) : 0;
  spans.forEach(function (sp, i) {
    sp.animate(
      [{ opacity: 0, transform: "translateY(26px)", clipPath: "inset(0 100% 0 0)" },
       { opacity: 1, transform: "translateY(0)", clipPath: "inset(0 0% 0 0)" }],
      { duration: PH_DUR, delay: REVEAL_START + i * stagger, fill: "both", easing: EASE });
  });
  var revealEnd = REVEAL_START + (n - 1) * stagger + PH_DUR;

  // 揭示完成:accent 下划线扫入(width 0 → 300px)
  add(document.getElementById("underline"),
    [{ width: "0px" }, { width: "300px" }],
    { duration: 650, delay: revealEnd + 150, easing: EASE });

  // 」 收尾弹簧入场
  add(document.getElementById("mark-close"),
    [{ opacity: 0, transform: "scale(.4)" },
     { opacity: 1, transform: "scale(1.08)", offset: 0.7 },
     { opacity: 1, transform: "scale(1)" }],
    { duration: 650, delay: revealEnd + 300, easing: SPRING });

  // 署名最后淡入(上浮)
  if (P.source) add(attrEl,
    [{ opacity: 0, transform: "translateY(20px)" }, { opacity: 1, transform: "translateY(0)" }],
    { duration: 600, delay: revealEnd + 700, easing: EASE });

  // 全程:辉光呼吸
  add(document.getElementById("glow"),
    [{ opacity: 0.08 }, { opacity: 0.17 }, { opacity: 0.08 }],
    { duration: Math.round(DURATION * 1000), easing: "ease-in-out" });

  // 本模板无动态计数文本,__seek 留空钩子即可(渲染器可选调用)
  window.__seek = function () {};
})();
</script>
</body>
</html>
