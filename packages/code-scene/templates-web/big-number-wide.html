<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--bg, #0f1b2d); font-family: var(--font-display, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif); position: relative; }
  .grid-bg { position: absolute; inset: 0;
    background-image: linear-gradient(var(--bg-grid, rgba(148,163,184,.05)) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid, rgba(148,163,184,.05)) 1px, transparent 1px);
    background-size: 96px 96px; }
  .glow { position: absolute; left: 50%; top: 560px; width: 1200px; height: 900px; transform: translate(-50%,-50%);
    background: radial-gradient(circle, var(--accent, #3b82f6) 0%, transparent 60%); opacity: .14; pointer-events: none; }
  .kicker { position: absolute; top: 72px; left: 96px; font-size: 26px; letter-spacing: 6px;
    color: var(--accent, #3b82f6); border: 1px solid color-mix(in srgb, var(--accent, #3b82f6) 45%, transparent);
    padding: 10px 22px 10px 28px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
  .title { position: absolute; top: 140px; left: 96px; font-size: 54px; font-weight: 700; color: var(--text, #f1f5f9); }
  .bignum { position: absolute; left: 0; right: 0; top: 340px; text-align: center;
    font-size: 330px; font-weight: 900; line-height: 1; letter-spacing: -4px;
    background: linear-gradient(135deg, var(--accent-2, #60a5fa), var(--accent, #3b82f6));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .bignum .unit { font-size: 130px; font-weight: 700; letter-spacing: 0; }
  .underline { position: absolute; left: 50%; top: 730px; transform: translateX(-50%);
    height: 12px; width: 0; border-radius: 6px;
    background: linear-gradient(90deg, var(--accent, #3b82f6), var(--accent-2, #60a5fa)); }
  .caption { position: absolute; left: 240px; right: 240px; top: 780px; text-align: center;
    font-size: 34px; color: var(--text-sub, #94a3b8); line-height: 1.6; }
  .corner { position: absolute; width: 56px; height: 56px; opacity: .35;
    border-color: var(--accent, #3b82f6); border-style: solid; border-width: 0; }
  .corner.tl { top: 40px; left: 40px; border-top-width: 4px; border-left-width: 4px; }
  .corner.tr { top: 40px; right: 40px; border-top-width: 4px; border-right-width: 4px; }
  .corner.bl { bottom: 40px; left: 40px; border-bottom-width: 4px; border-left-width: 4px; }
  .corner.br { bottom: 40px; right: 40px; border-bottom-width: 4px; border-right-width: 4px; }
  .source { position: absolute; bottom: 28px; left: 96px; font-size: 22px; color: var(--text-sub, #94a3b8); opacity: .8; }
</style>
</head>
<body>
<div class="grid-bg"></div><div class="glow" id="glow"></div>
<div class="kicker" id="kicker"></div><div class="title" id="title"></div>
<div class="bignum" id="num">0</div>
<div class="underline" id="uline"></div>
<div class="caption" id="caption"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="source" id="source"></div>
<script>
(function () {
  var style = document.createElement("style");
  style.textContent = window.__THEME_CSS__ || "";
  document.head.appendChild(style);
  var P = window.__PARAMS__ || {};
  var D = P.duration || 6;
  document.getElementById("kicker").textContent = P.kicker || "";
  document.getElementById("kicker").style.display = P.kicker ? "" : "none";
  document.getElementById("title").textContent = P.title || "";
  document.getElementById("caption").textContent = P.caption || "";
  document.getElementById("source").textContent = P.source ? "来源:" + P.source : "";

  function fmt(v) {
    var f = P.format || "plain", u = P.unit || "", abs = Math.abs(v), core;
    if (f === "percent") core = v.toFixed(1) + "%";
    else if (f === "wan") core = (abs < 1000 ? v : v / 10000).toFixed(1);
    else if (f === "yi") core = (abs < 1000 ? v : v / 100000000).toFixed(2);
    else core = v >= 10000 ? String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") : String(Math.round(v));
    return core;
  }
  var suffix = (P.format === "wan" ? "万" : P.format === "yi" ? "亿" : "") + (P.unit || "");

  var EASE = "cubic-bezier(0.16, 1, 0.3, 1)";
  var SPRING = "cubic-bezier(0.34, 1.56, 0.64, 1)";
  function add(el, kf, o) { el.animate(kf, Object.assign({ fill: "both" }, o)); }

  var num = document.getElementById("num");
  add(document.getElementById("kicker"), [{ opacity: 0, transform: "translateY(24px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 450, easing: EASE });
  add(document.getElementById("title"), [{ opacity: 0, transform: "translateY(30px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 550, delay: 140, easing: EASE });
  add(num, [{ opacity: 0, transform: "scale(0.55)" }, { opacity: 1, transform: "scale(1.05)", offset: 0.72 }, { opacity: 1, transform: "scale(1)" }], { duration: 750, delay: 450, easing: SPRING });
  add(document.getElementById("uline"), [{ width: "0px" }, { width: "460px" }], { duration: 900, delay: 1250, easing: EASE });
  add(num, [{ transform: "scale(1)" }, { transform: "scale(1.04)" }, { transform: "scale(1)" }], { duration: 450, delay: 1250 + 900, easing: EASE });
  add(document.getElementById("caption"), [{ opacity: 0, transform: "translateY(24px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 550, delay: 2400, easing: EASE });
  add(document.getElementById("glow"), [{ opacity: 0.10 }, { opacity: 0.18 }, { opacity: 0.10 }], { duration: Math.round(D * 1000), easing: "ease-in-out" });

  // 计数:__seek 驱动,1.25s 起滚 1.3s,前快后慢
  var FROM = 1.25, DUR = 1.3, target = P.value || 0;
  var shortMode = D <= 4.5, startFrac = shortMode ? 0.6 : 0;
  if (shortMode) { FROM = 0.6; DUR = 0.7; }
  window.__seek = function (t) {
    var p = Math.min(Math.max((t - FROM) / DUR, 0), 1);
    var eased = 1 - Math.pow(1 - p, 3);
    var v = target * (startFrac + (1 - startFrac) * eased);
    num.innerHTML = fmt(v) + '<span class="unit">' + suffix + "</span>";
  };
  window.__seek(0);
})();
</script>
</body>
</html>
