<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--bg, #0f1b2d); font-family: var(--font-display, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif); position: relative; }
  .grid-bg { position: absolute; inset: 0;
    background-image: linear-gradient(var(--bg-grid, rgba(148,163,184,.05)) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid, rgba(148,163,184,.05)) 1px, transparent 1px);
    background-size: 96px 96px; }
  .kicker { position: absolute; top: 72px; left: 96px; font-size: 26px; letter-spacing: 6px;
    color: var(--accent, #3b82f6); border: 1px solid color-mix(in srgb, var(--accent, #3b82f6) 45%, transparent);
    padding: 10px 22px 10px 28px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
  .title { position: absolute; top: 140px; left: 96px; font-size: 50px; font-weight: 700; color: var(--text, #f1f5f9); }
  /* 金句区:水平居中,内容 x∈[260,1660],y∈[300,880](字幕带 900 起) */
  #quote-zone { position: absolute; top: 290px; left: 260px; right: 260px; height: 590px;
    display: flex; flex-direction: column; justify-content: center; }
  .mark { font-family: Georgia, "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
    font-size: 150px; font-weight: 900; line-height: 1; height: 140px;
    color: var(--accent, #3b82f6); opacity: 0; pointer-events: none; user-select: none; }
  .mark.open { align-self: flex-start; margin: 0 0 14px -6px; }
  .mark.close { align-self: flex-end; margin: 16px -6px 0 0; }
  #quote { font-size: 62px; font-weight: 700; color: var(--text, #f1f5f9);
    line-height: 1.6; letter-spacing: 1px; text-align: left; }
  #quote .ph { display: inline-block; will-change: transform, opacity; }
  #underline { margin-top: 40px; height: 12px; width: 0; border-radius: 6px;
    background: linear-gradient(90deg, var(--accent, #3b82f6), var(--accent-2, #60a5fa)); align-self: flex-start; }
  #attribution { margin-top: 44px; align-self: flex-end; font-size: 34px; font-weight: 500;
    color: var(--text-sub, #94a3b8); letter-spacing: 2px; opacity: 0; white-space: nowrap; }
  #attribution .dash { color: var(--accent, #3b82f6); margin-right: 12px; }
  .corner { position: absolute; width: 56px; height: 56px; opacity: .35;
    border-color: var(--accent, #3b82f6); border-style: solid; border-width: 0; }
  .corner.tl { top: 40px; left: 40px; border-top-width: 4px; border-left-width: 4px; }
  .corner.tr { top: 40px; right: 40px; border-top-width: 4px; border-right-width: 4px; }
  .corner.bl { bottom: 40px; left: 40px; border-bottom-width: 4px; border-left-width: 4px; }
  .corner.br { bottom: 40px; right: 40px; border-bottom-width: 4px; border-right-width: 4px; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="kicker" id="kicker"></div><div class="title" id="title"></div>
<div id="quote-zone">
  <div class="mark open" id="mark-open">「</div>
  <div id="quote"></div>
  <div id="underline"></div>
  <div id="attribution"><span class="dash">——</span><span id="attr-text"></span></div>
  <div class="mark close" id="mark-close">」</div>
</div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<script>
(function () {
  var style = document.createElement("style");
  style.textContent = window.__THEME_CSS__ || "";
  document.head.appendChild(style);
  var P = window.__PARAMS__ || {};
  var D = P.duration || 8;

  var quote = P.quote || P.title || "";
  document.getElementById("kicker").textContent = P.kicker || "金句";
  document.getElementById("title").textContent = P.title && P.quote ? P.title : "";
  if (!P.quote) document.getElementById("title").textContent = "";
  document.getElementById("attr-text").textContent = P.source || "";

  // 按标点切短语,逐组揭示
  var phrases = quote.split(/(?<=[,;?!;,.!?;:])/u).filter(function (s) { return s.trim(); });
  var qEl = document.getElementById("quote");
  phrases.forEach(function (ph) {
    var span = document.createElement("span");
    span.className = "ph";
    span.textContent = ph;
    qEl.appendChild(span);
  });

  var EASE = "cubic-bezier(0.16, 1, 0.3, 1)";
  var SPRING = "cubic-bezier(0.34, 1.56, 0.64, 1)";
  function add(el, kf, o) { el.animate(kf, Object.assign({ fill: "both" }, o)); }

  add(document.getElementById("kicker"), [{ opacity: 0 }, { opacity: 1 }], { duration: 400, easing: EASE });
  if (document.getElementById("title").textContent) {
    add(document.getElementById("title"), [{ opacity: 0, transform: "translateY(24px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 500, delay: 120, easing: EASE });
  }
  add(document.getElementById("mark-open"),
    [{ opacity: 0, transform: "scale(0.4)" }, { opacity: 0.9, transform: "scale(1.08)", offset: 0.72 }, { opacity: 0.9, transform: "scale(1)" }],
    { duration: 600, delay: 400, easing: SPRING });

  var m = phrases.length;
  var phStagger = Math.min(500, Math.max(200, (D * 1000 * 0.42) / Math.max(m, 1)));
  document.querySelectorAll("#quote .ph").forEach(function (span, i) {
    add(span, [{ opacity: 0, transform: "translateY(26px)" }, { opacity: 1, transform: "translateY(0)" }],
      { duration: 450, delay: 900 + i * phStagger, easing: EASE });
  });
  var endMs = 900 + m * phStagger;
  add(document.getElementById("underline"), [{ width: "0px" }, { width: "380px" }], { duration: 800, delay: endMs, easing: EASE });
  if (P.source) add(document.getElementById("attribution"), [{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: endMs + 400, easing: EASE });
  add(document.getElementById("mark-close"),
    [{ opacity: 0, transform: "scale(0.4)" }, { opacity: 0.9, transform: "scale(1.06)", offset: 0.72 }, { opacity: 0.9, transform: "scale(1)" }],
    { duration: 550, delay: endMs + 250, easing: SPRING });
})();
</script>
</body>
</html>
